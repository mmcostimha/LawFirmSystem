

#See all the actuators
management.endpoints.web.exposure.include = *
management.endpoint.health.show-details = always

# Configuration of postgresSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lawfirm_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.generate-ddl=true

# Configuration of Hibernate (JPA)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#Scheduler config(cron expression)
#Everyday at 7am
spring.task.scheduling.cron = 0 0 7 * * ?
#Every 1min
spring.task1.scheduling.cron = 0 * * * * ?

#AWS
aws.region = eu-west-3